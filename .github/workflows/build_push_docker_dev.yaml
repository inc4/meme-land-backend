name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

env:
  AWS_REGION: eu-west-1
  ECR_REGISTRY: 131475704591.dkr.ecr.eu-west-1.amazonaws.com
  ECR_REPOSITORY: truetrading/meme-land-backend
  IP_ADDR: "3.69.1.5"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::131475704591:role/my-github-actions-role
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: truetrading/true-token-presale-backend
          SHORT_SHA: ${{ steps.vars.outputs.SHORT_SHA }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          
          if [ "$REF_TYPE" = "tag" ]; then
            TARGET="runtime"           # production image (no debug tools)
            IMAGE_TAG="$REF_NAME"      # use the git tag
            PUSH_LATEST="true"         # overwrite :latest on releases
            PUSH_BRANCH="false"        # don't push branch tag on releases
          else
            TARGET="runtime-debug"     # dev image (with debug tools)
            IMAGE_TAG="$SHORT_SHA"     # short commit sha
            PUSH_LATEST="false"        # don't overwrite :latest on dev
            PUSH_BRANCH="true"         # push :BRANCH tag for dev
          fi

          echo "Building as $REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker build -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" .

          echo "Pushing $REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"

          if [ "$PUSH_BRANCH" = "true" ]; then
            echo "Tagging and pushing :$REF_NAME for dev"
            docker tag "$REGISTRY/$REPOSITORY:$IMAGE_TAG" "$REGISTRY/$REPOSITORY:$REF_NAME"
            docker push "$REGISTRY/$REPOSITORY:$REF_NAME"
          fi

          if [ "$PUSH_LATEST" = "true" ]; then
            echo "Tagging and pushing :latest for prod"
            docker tag "$REGISTRY/$REPOSITORY:$IMAGE_TAG" "$REGISTRY/$REPOSITORY:latest"
            docker push "$REGISTRY/$REPOSITORY:latest"
          fi
      
